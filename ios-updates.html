<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Управление обновлениями iOS</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101827;
      color: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #233653 0%, #101827 58%);
    }
    main {
      width: min(100%, 520px);
      padding: 32px;
      border: 1px solid #34445c;
      border-radius: 24px;
      background: rgba(18, 29, 46, .94);
      box-shadow: 0 24px 70px rgba(0,0,0,.32);
    }
    h1 { margin: 0 0 10px; font-size: clamp(25px, 6vw, 34px); }
    .subtitle { margin: 0 0 28px; color: #b8c5d8; line-height: 1.5; }
    .actions { display: grid; gap: 14px; }
    .button {
      display: block;
      padding: 18px 20px;
      border-radius: 14px;
      text-align: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: 650;
      color: white;
      background: #2563eb;
      transition: transform .15s ease, filter .15s ease;
    }
    .button.secondary { background: #475569; }
    .button:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    .note {
      margin: 22px 0 0;
      padding: 13px 15px;
      border-radius: 12px;
      background: #332b1d;
      color: #f6d9a2;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Обновления iOS</h1>
    <p class="subtitle">Выберите нужное действие.</p>
    <div class="actions">
      <a class="button" href="https://dhinakg.github.io/delayed-otas" target="_blank" rel="noopener noreferrer">
        Отложенные обновления
      </a>
      <a class="button secondary" href="https://pegakmop.github.io/noota-26.mobileconfig">
        Блокировка обновлений
      </a>
    </div>
    <p class="note">
      Важно: Delayed OTAs не поддерживаются на iOS 27 и новее.
    </p>
  </main>
</body>
</html>
